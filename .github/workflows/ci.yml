name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build, Test & Lint
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Cache SPM packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            Packages/Core/.build
            Packages/Services/.build
            Packages/SharedUI/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Remove unused Homebrew tap
        run: |
          TAP_PATH="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          if [[ -d "$TAP_PATH" ]]; then
            HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew untap aws/tap
          fi

      - name: Print Swift version
        run: swift --version

      - name: Build Core
        run: swift build --package-path Packages/Core

      - name: Build Services
        run: swift build --package-path Packages/Services

      - name: Build SharedUI
        run: swift build --package-path Packages/SharedUI

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Xcode app gate
        run: bash scripts/xcode-gate.sh
        timeout-minutes: 15

      - name: Unlock Keychain for tests
        run: security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db

      - name: Clear cached coverage data
        run: |
          for build_path in Packages/Core/.build Packages/Services/.build; do
            if [[ -d "$build_path" ]]; then
              find "$build_path" -type d -name codecov -prune -exec rm -rf {} +
            fi
          done

      - name: Test Core
        run: swift test --package-path Packages/Core --enable-code-coverage
        timeout-minutes: 5

      - name: Test Services
        run: swift test --package-path Packages/Services --enable-code-coverage
        timeout-minutes: 5

      # SharedUITests and DesignUITests existed and compiled but no job ran
      # them, which is why their coverage read as ~0 — nothing was measuring.
      # No threshold yet: a floor set at today's number would ratify the hole.
      - name: Test SharedUI
        run: swift test --package-path Packages/SharedUI --enable-code-coverage
        timeout-minutes: 5

      - name: Test DesignUI
        run: swift test --package-path Packages/DesignUI --enable-code-coverage
        timeout-minutes: 5

      - name: Check coverage thresholds
        run: |
          FAILED=0

          # Core coverage (threshold: 85%)
          echo "=== Core coverage ==="
          CORE_BIN_PATH=$(
            swift build --package-path Packages/Core \
              --configuration debug --disable-automatic-resolution --show-bin-path
          )
          CORE_BINARY="$CORE_BIN_PATH/CorePackageTests.xctest/Contents/MacOS/CorePackageTests"
          CORE_PROFDATA="$CORE_BIN_PATH/codecov/default.profdata"
          if [ -f "$CORE_PROFDATA" ] && [ -f "$CORE_BINARY" ]; then
            xcrun llvm-cov report "$CORE_BINARY" \
              -instr-profile "$CORE_PROFDATA" \
              --ignore-filename-regex="Tests/" --ignore-filename-regex="\.build/" | tail -3
            CORE_COV=$(xcrun llvm-cov export "$CORE_BINARY" \
              -instr-profile "$CORE_PROFDATA" --summary-only \
              --ignore-filename-regex="Tests/" --ignore-filename-regex="\.build/" 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(int(d['data'][0]['totals']['lines']['percent']))")
            echo "Core line coverage: ${CORE_COV}% (threshold: 85%)"
            if [ "$CORE_COV" -lt 85 ]; then
              echo "::error::Core coverage ${CORE_COV}% is below threshold 85%"
              FAILED=1
            fi
          else
            echo "::error::Core coverage data not found"
            FAILED=1
          fi

          # Services coverage (threshold: 65%)
          # Excludes Core/ sources (tested separately) and system-dependent files
          echo "=== Services coverage ==="
          SERVICES_BIN_PATH=$(
            swift build --package-path Packages/Services \
              --configuration debug --disable-automatic-resolution --show-bin-path
          )
          SERVICES_BINARY="$SERVICES_BIN_PATH/ServicesPackageTests.xctest/Contents/MacOS/ServicesPackageTests"
          SERVICES_PROFDATA="$SERVICES_BIN_PATH/codecov/default.profdata"
          if [ -f "$SERVICES_PROFDATA" ] && [ -f "$SERVICES_BINARY" ]; then
            xcrun llvm-cov report "$SERVICES_BINARY" \
              -instr-profile "$SERVICES_PROFDATA" \
              --ignore-filename-regex="Tests/" --ignore-filename-regex="\.build/" --ignore-filename-regex="Core/" | tail -3
            SVC_COV=$(xcrun llvm-cov export "$SERVICES_BINARY" \
              -instr-profile "$SERVICES_PROFDATA" --summary-only \
              --ignore-filename-regex="Tests/" --ignore-filename-regex="\.build/" --ignore-filename-regex="Core/" 2>/dev/null \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(int(d['data'][0]['totals']['lines']['percent']))")
            echo "Services line coverage: ${SVC_COV}% (threshold: 65%)"
            if [ "$SVC_COV" -lt 65 ]; then
              echo "::error::Services coverage ${SVC_COV}% is below threshold 65%"
              FAILED=1
            fi
          else
            echo "::error::Services coverage data not found"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All coverage thresholds passed"

      - name: Validate entitlements
        run: bash scripts/validate-entitlements.sh

      - name: Install lint tools
        env:
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
          PERIPHERY_VERSION: 3.8.0
        run: |
          brew install swiftlint swiftformat
          PERIPHERY_DIRECTORY="$RUNNER_TEMP/periphery-${PERIPHERY_VERSION}"
          PERIPHERY_ARCHIVE="${PERIPHERY_DIRECTORY}.zip"
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
            --output "$PERIPHERY_ARCHIVE" \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          echo "${PERIPHERY_SHA256}  ${PERIPHERY_ARCHIVE}" | shasum --algorithm 256 --check
          mkdir -p "$PERIPHERY_DIRECTORY"
          unzip -q "$PERIPHERY_ARCHIVE" -d "$PERIPHERY_DIRECTORY"
          echo "$PERIPHERY_DIRECTORY" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: >
          swiftlint lint --strict
          App
          Agent
          Packages/Core/Sources
          Packages/DesignUI/Sources
          Packages/Services/Sources
          Packages/SharedUI/Sources

      - name: Run SwiftFormat (check)
        run: >
          swiftformat
          App
          Agent
          Packages/Core/Sources
          Packages/DesignUI/Sources
          Packages/Services/Sources
          Packages/SharedUI/Sources
          --lint

      # The previous form scanned Core and Services only, with --retain-public.
      # Every cross-package declaration is public by construction, so the flag
      # suppressed nearly everything and App/, Agent/, SharedUI and DesignUI
      # were never scanned at all — which is how ~3,900 lines of dead App code
      # survived to slice 17. This scans the whole project through the index
      # xcode-gate already produced, so --retain-public is unnecessary.
      #
      # A ratchet, not a clean bill: unused declarations and redundant public
      # access are separate debt categories, so neither can hide growth in the
      # other. Every warning stays visible; an unknown category fails closed.
      - name: Scan for unused code (Periphery)
        run: |
          UNUSED_BASELINE=$(awk -F= '$1 == "unused" { print $2 }' .periphery-baseline)
          ACCESSIBILITY_BASELINE=$(awk -F= '$1 == "redundant_public_accessibility" { print $2 }' .periphery-baseline)
          if [[ ! $UNUSED_BASELINE =~ ^[0-9]+$ || ! $ACCESSIBILITY_BASELINE =~ ^[0-9]+$ ]]; then
            echo "::error::Periphery baselines must be non-negative integers"
            exit 1
          fi
          set +e
          periphery scan \
            --project GenreUpdater.xcodeproj \
            --schemes GenreUpdater \
            --skip-build \
            --index-store-path .build/xcode/Index.noindex/DataStore \
            --retain-codable-properties \
            --retain-swift-ui-previews \
            --retain-assign-only-properties \
            --retain-objc-accessible \
            --exclude-tests \
            --quiet > periphery-report.txt 2>&1
          STATUS=$?
          set -e
          # Without --strict, findings do not set the exit status, so a nonzero
          # code means the scan itself failed — an unreadable index, a rejected
          # option after a tool update. Swallowing it would let the error text
          # land in the report, yield a count of 0, and pass the ratchet as an
          # improvement: this gate reporting success for a scan that never ran,
          # which is the exact fault it was written to fix.
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Periphery scan failed with exit ${STATUS}"
            cat periphery-report.txt
            exit 1
          fi
          UNUSED_COUNT=$(grep -c "warning: Unused" periphery-report.txt || true)
          ACCESSIBILITY_COUNT=$(grep -c "warning: Redundant public accessibility" periphery-report.txt || true)
          WARNING_COUNT=$(grep -c "warning:" periphery-report.txt || true)
          KNOWN_WARNING_COUNT=$((UNUSED_COUNT + ACCESSIBILITY_COUNT))
          BASELINE_WARNING_COUNT=$((UNUSED_BASELINE + ACCESSIBILITY_BASELINE))
          echo "Unused declarations: ${UNUSED_COUNT} (baseline: ${UNUSED_BASELINE})"
          echo "Redundant public accessibility: ${ACCESSIBILITY_COUNT} (baseline: ${ACCESSIBILITY_BASELINE})"
          grep "warning:" periphery-report.txt || true
          # A clean exit over an empty report is the other way a broken scan
          # looks like success — a wrong scheme indexes nothing at all.
          if [ "$WARNING_COUNT" -eq 0 ] && [ "$BASELINE_WARNING_COUNT" -gt 0 ]; then
            echo "::error::Scan reported zero warnings against nonzero baselines; treating as a failed scan"
            cat periphery-report.txt
            exit 1
          fi
          if [ "$WARNING_COUNT" -ne "$KNOWN_WARNING_COUNT" ]; then
            echo "::error::Periphery reported an unclassified warning category"
            exit 1
          fi
          if [ "$UNUSED_COUNT" -gt "$UNUSED_BASELINE" ]; then
            echo "::error::Unused declarations rose from ${UNUSED_BASELINE} to ${UNUSED_COUNT}"
            exit 1
          fi
          if [ "$ACCESSIBILITY_COUNT" -gt "$ACCESSIBILITY_BASELINE" ]; then
            echo "::error::Redundant public accessibility rose from ${ACCESSIBILITY_BASELINE} to ${ACCESSIBILITY_COUNT}"
            exit 1
          fi
          if [ "$UNUSED_COUNT" -lt "$UNUSED_BASELINE" ]; then
            echo "::notice::Unused declarations fell to ${UNUSED_COUNT}; lower its baseline to lock it in"
          fi
          if [ "$ACCESSIBILITY_COUNT" -lt "$ACCESSIBILITY_BASELINE" ]; then
            echo "::notice::Redundant public accessibility fell to ${ACCESSIBILITY_COUNT}; lower its baseline to lock it in"
          fi

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    if: always()
    permissions: {}

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-and-lint.result }}" != "success" ]]; then
            echo "::error::build-and-lint failed with status: ${{ needs.build-and-lint.result }}"
            exit 1
          fi
          echo "All CI checks passed"
